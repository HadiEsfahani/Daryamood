<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قیمت‌های روز</title>
<style>
  body {
    font-family: Tahoma, "Vazirmatn", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  h1 {
    text-align: center;
    margin-bottom: 4px;
  }
  #updated {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
    font-size: 14px;
  }
  input#search {
    display: block;
    margin: 0 auto 20px auto;
    padding: 10px;
    width: 100%;
    max-width: 400px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
  }
  table {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    border-collapse: collapse;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    text-align: right;
    font-size: 14px;
  }
  th {
    background: #2c3e50;
    color: #fff;
    position: sticky;
    top: 0;
  }
  tr:hover {
    background: #fafafa;
  }
  .source {
    color: #888;
    font-size: 12px;
  }
  #empty {
    text-align: center;
    color: #888;
    margin-top: 40px;
  }
</style>
</head>
<body>

  <h1>قیمت‌های روز</h1>
  <div id="updated">در حال بارگذاری...</div>

  <input type="text" id="search" placeholder="جستجو در نام محصول یا منبع...">

  <table id="price-table" style="display:none">
    <thead>
      <tr>
        <th>منبع</th>
        <th>نام</th>
        <th>قیمت</th>
      </tr>
    </thead>
    <tbody id="price-body"></tbody>
  </table>

  <div id="empty" style="display:none">هنوز داده‌ای موجود نیست.</div>

<script>
  fetch('prices.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      const items = data.items || [];
      const updatedEl = document.getElementById('updated');
      updatedEl.textContent = data.updated_at
        ? 'آخرین بروزرسانی: ' + data.updated_at
        : 'هنوز بروزرسانی نشده';

      if (items.length === 0) {
        document.getElementById('empty').style.display = 'block';
        return;
      }

      const table = document.getElementById('price-table');
      const tbody = document.getElementById('price-body');
      table.style.display = 'table';

      function render(list) {
        tbody.innerHTML = '';
        list.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML =
            '<td class="source">' + item.source + '</td>' +
            '<td>' + item.name + '</td>' +
            '<td>' + item.price + '</td>';
          tbody.appendChild(tr);
        });
      }

      render(items);

      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.trim();
        if (!q) { render(items); return; }
        const filtered = items.filter(item =>
          item.name.includes(q) || item.source.includes(q)
        );
        render(filtered);
      });
    })
    .catch(err => {
      document.getElementById('updated').textContent = 'خطا در بارگذاری اطلاعات';
      console.error(err);
    });
</script>

</body>
</html>
